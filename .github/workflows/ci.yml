name: CI
on:
  push:
    branches: [main, feat/ws53-control-core-protocol]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src,rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --target x86_64-unknown-linux-gnu --features defmt
      - run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-gnu --features defmt -- -D warnings
      - run: cargo check --locked -Zbuild-std=core,alloc --target riscv32imfc-unknown-none-elf
